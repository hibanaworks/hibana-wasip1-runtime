[package]
name = "hibana-wasip1-runtime"
version = "0.1.0"
edition = "2024"
autoexamples = false
rust-version = "1.95"
description = "Hibana-bound WASI Preview 1 runtime boundary for choreographed Wasm guests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hibanaworks/hibana-wasip1-runtime"
homepage = "https://github.com/hibanaworks/hibana-wasip1-runtime"
documentation = "https://docs.rs/hibana-wasip1-runtime"
readme = "README.md"
keywords = ["hibana", "wasi", "wasip1", "wasm", "no-std"]
categories = ["wasm", "embedded", "no-std"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/rust-toolchain.toml",
    "/src/**",
    "/examples/**",
    "/scripts/**",
    "/proofs/**",
]

[[example]]
name = "direct_choreofs_write_rejection"
path = "examples/direct_choreofs_write_rejection/main.rs"

[[example]]
name = "sequenced_choreofs_write"
path = "examples/sequenced_choreofs_write/main.rs"

[dependencies]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "b7d65518b07226a3d69a140bbaf17d4c80fb65a8", version = "=0.10.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt", "macros"] }

[lints.rust]
long_running_const_eval = "forbid"
