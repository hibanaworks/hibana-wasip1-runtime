name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    defaults:
      run:
        working-directory: hibana-wasip1-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hibana-wasip1-runtime
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          rustup target add --toolchain stable thumbv8m.main-none-eabi wasm32-wasip1
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.30.0
      - name: Install Miri toolchain
        run: rustup toolchain install nightly-2026-05-28 --profile minimal --component miri --component rust-src
      - name: Fetch locked dependencies for offline checks
        run: cargo +stable fetch --locked
      - name: Run quality gates
        shell: bash
        run: |
          set -euo pipefail
          core_manifest="$(cargo +stable metadata --locked --format-version 1 | jq -er '
            [.packages[] | select(.name == "hibana")] |
            if length == 1 then .[0].manifest_path else error("expected one selected Hibana") end
          ')"
          bash "$(dirname "$core_manifest")/.github/scripts/lib/resource_guard.sh" \
            bash scripts/check_runtime_gates.sh
