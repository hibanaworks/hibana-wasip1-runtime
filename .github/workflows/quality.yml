name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install release toolchain
        run: rustup show active-toolchain
      - name: Install Miri toolchain
        run: rustup toolchain install nightly-2026-05-28 --profile minimal --component miri
      - name: Run quality gates
        run: bash scripts/check_runtime_gates.sh
