name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.95.0 thumbv6m-none-eabi wasm32-wasip1
      - name: Install Miri toolchain
        run: rustup toolchain install nightly-2026-05-28 --profile minimal --component miri --component rust-src
      - name: Run quality gates
        run: bash scripts/check_runtime_gates.sh
